# Release: on a v* tag — or a manual run given a version input — run the full
# test job, cross-build the single-file wowstreamd.exe (client PWA + addon
# embedded via go:embed), and attach it to a GitHub Release (creating the tag
# for manual runs). workflow_dispatch with an empty version is a dry run
# (tests only).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.1.0); leave empty for a test-only dry run'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Keep these steps identical to ci.yml's test job — ci.yml's header
      # promises "the same test job as release.yml", so a tag can never be
      # released from a commit that CI would have failed.
      - name: gofmt
        run: |
          out="$(gofmt -l server *.go)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: go test
        run: go test ./...

      - name: cross-build wowstreamd.exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" ./server/cmd/wowstreamd

      # Dry-run compile of the NSIS installer script against the exe built
      # above, with placeholder defines — catches script rot on every push.
      - name: installer compile check (makensis)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -DVERSION=v0.0.0-ci -DEXE="$PWD/wowstreamd.exe" installer/wowmobile.nsi

      - name: client tests
        working-directory: client
        run: node --test tests/

      # node --test only exercises the phone client; this gate also covers JS
      # that ships without tests (notably the client/host dashboard's host.js,
      # which is embedded into the exe via HostFS).
      - name: JS syntax check (all shipped JS)
        run: |
          for f in $(find client server -name '*.js'); do
            node --check "$f" || exit 1
          done

      # End-to-end streaming gate: a real wowstreamd (--capture test: ffmpeg
      # testsrc2 through the production encoder flags, Annex-B parser, and
      # pion sample path) streamed into a real browser over real WebRTC — the
      # suite asserts frames actually DECODE (inbound-rtp framesDecoded), the
      # picture is NOT black (canvas pixel variance), and input round-trips.
      # Playwright's Chromium is built without H264 and would SKIP the decode
      # test, so this step guarantees a real Google Chrome itself (installing
      # one when the runner image stops preinstalling it — branded-channel
      # installs error when Chrome already exists, hence the presence check)
      # AND sets WOWMOBILE_REQUIRE_H264 so a skipped decode test is a hard
      # job failure, never a silent green: the gate must RUN to count.
      - name: e2e streaming pipeline (Playwright)
        working-directory: e2e
        env:
          WOWMOBILE_REQUIRE_H264: "1"
        run: |
          sudo apt-get install -y -qq ffmpeg
          npm ci
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            npx playwright install --with-deps chrome
          fi
          npx playwright install --with-deps chromium
          npm test

      - name: addon Lua syntax check
        run: |
          npm install --no-save luaparse
          node -e '
            const luaparse = require("luaparse");
            const fs = require("fs");
            const files = process.argv.slice(1);
            let failed = false;
            for (const f of files) {
              try {
                luaparse.parse(fs.readFileSync(f, "utf8"), { luaVersion: "5.1" });
              } catch (e) {
                failed = true;
                console.error(`${f}: ${e.message}`);
              }
            }
            if (failed) process.exit(1);
            console.log(`${files.length} Lua files parse cleanly`);
          ' $(find addon -name '*.lua')

      # The shipped 1.12 addon must be Lua 5.0: constructs like '#', '%', or
      # string.match parse under the 5.1 grammar above but crash at runtime
      # on the vanilla client, so hold it to the dedicated conformance gate.
      - name: vanilla addon Lua 5.0 conformance
        run: node tools/lua50check.js $(find addon/WowMobile_Vanilla -name '*.lua')

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    env:
      # Tag ref on tag pushes; the version input on manual runs.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -H=windowsgui: the released exe is a windowed app — no console on
      # double-click; a terminal launch attaches back to the shell's console
      # (see server/cmd/wowstreamd/ui_windows.go).
      - name: build wowstreamd.exe
        run: >
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath
          -ldflags "-s -w -H=windowsgui -X main.version=$VERSION"
          -o wowstreamd.exe ./server/cmd/wowstreamd

      - name: build WowMobile-Setup.exe (NSIS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -DVERSION="$VERSION" -DEXE="$PWD/wowstreamd.exe" installer/wowmobile.nsi

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          # Pin the created tag to the tested commit, not the default branch head.
          target_commitish: ${{ github.sha }}
          # Both artifacts: the installer for most people, the bare exe as
          # the portable alternative (README quickstart).
          files: |
            installer/WowMobile-Setup.exe
            wowstreamd.exe
          generate_release_notes: true
